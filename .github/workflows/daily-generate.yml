name: Validate authored question bank
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/learning/**'
      - 'tests/**'
      - 'api/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
